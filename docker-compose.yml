services:
  ramavisa:
    image: git.cappe.dev/cappe/ramavisa:latest@sha256:50652af9fbb23ebb5822e355df209095eb012b042b2ac5018de85b44dc8f8eb9
    container_name: ramavisa
    restart: always
    environment:
      - NODE_ENV=production
      - QUIZ_JSON_URL=https://files.fuckmylife.fi/quiz.json
      - DATABASE_URL=postgresql://ramavisa:visa@db:5432/ramavisa
    volumes:
      - ./.env:/app/.env
      - ./database.db:/app/database.db
    depends_on:
      - db
    networks:
      - visabot-network

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ramavisa
      POSTGRES_PASSWORD: visa
      POSTGRES_DB: ramavisa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visabot-network

networks:
  visabot-network:
    driver: bridge

volumes:
  postgres_data:
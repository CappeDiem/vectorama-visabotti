services:
  ramavisa:
    image: git.cappe.dev/cappe/ramavisa:latest@sha256:50652af9fbb23ebb5822e355df209095eb012b042b2ac5018de85b44dc8f8eb9
    container_name: ramavisa
    restart: always
    environment:
      - NODE_ENV=production
      - QUIZ_JSON_URL=https://files.fuckmylife.fi/quiz.json
      - DATABASE_URL=postgresql://ramavisa:visa@db:5432/ramavisa
    volumes:
      - ./.env:/app/.env
      - ./database.db:/app/database.db
    depends_on:
      - db
    networks:
      - visabot-network

  db:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    container_name: postgres_db
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ramavisa
      POSTGRES_PASSWORD: visa
      POSTGRES_DB: ramavisa
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - visabot-network

  valkey:
    image: valkey/valkey:9-alpine@sha256:3ad5a213cb1bc2fd4a113c89b6248a88655a6bf1dda69519d04e03cd3e3d2742
    container_name: valkey
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - visabot-network

networks:
  visabot-network:
    driver: bridge

volumes:
  postgres_data:
  valkey_data: